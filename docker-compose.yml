# Base de données locale pour le développement : `docker compose up -d`
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mys
      POSTGRES_PASSWORD: mys
      POSTGRES_DB: mys
    ports:
      - "5432:5432"
    volumes:
      - mys-pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  mys-pgdata:
